<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de fscryptography</title><desc id="desc">MasterKey abre Manager con primitivas independientes para contenido y nombres. Las operaciones de rutas interactúan con filesystem y journals.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8f8"/><stop offset="1" stop-color="#e8eff0"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263b46"/><stop offset="1" stop-color="#17252d"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8f3ee"/><stop offset="1" stop-color="#b9e3dc"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#53727c" stroke-width="1.5"/></marker><style>.h{font:700 25px Inter,Segoe UI,Arial;fill:#17252d}.t{font:500 18px Inter,Segoe UI,Arial;fill:#29414b}.s{font:500 15px Inter,Segoe UI,Arial;fill:#50666e}.box{stroke:#a9bec2;stroke-width:2}.arrow{fill:none;stroke:#53727c;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="60" y="62" class="h" font-size="31">fscryptography · modelo de operaciones</text><text x="60" y="92" class="s">Operaciones por ruta · separación de claves · evidencia transaccional</text>
<rect x="60" y="145" width="230" height="125" rx="18" fill="url(#dark)" class="box"/><text x="175" y="190" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#fff">MasterKey</text><text x="175" y="222" text-anchor="middle" font-family="Inter,Arial" font-size="15" fill="#d5e4e6">contenedor Base64</text><text x="175" y="245" text-anchor="middle" font-family="Inter,Arial" font-size="14" fill="#a9dcd3">contraseña opcional</text>
<path d="M290 208H370" class="arrow"/><rect x="375" y="145" width="220" height="125" rx="18" fill="#fff" class="box"/><text x="485" y="190" text-anchor="middle" class="h">Manager</text><text x="485" y="222" text-anchor="middle" class="t">abrir / reutilizar / cerrar</text><text x="485" y="245" text-anchor="middle" class="s">ciclo de vida del contexto</text>
<path d="M595 208H665V155H715" class="arrow"/><path d="M665 208V270H715" class="arrow"/><rect x="720" y="110" width="250" height="100" rx="16" fill="url(#teal)" class="box"/><text x="845" y="151" text-anchor="middle" class="h">Keyset de contenido</text><text x="845" y="181" text-anchor="middle" class="t">Streaming AEAD</text><rect x="720" y="225" width="250" height="100" rx="16" fill="#fff" class="box"/><text x="845" y="266" text-anchor="middle" class="h">Keyset de nombres</text><text x="845" y="296" text-anchor="middle" class="t">AEAD</text>
<path d="M970 160H1025V218" class="arrow"/><path d="M970 275H1025V218" class="arrow"/><rect x="1028" y="160" width="125" height="120" rx="16" fill="#fff" class="box"/><text x="1090" y="205" text-anchor="middle" class="h" font-size="19">Rutas</text><text x="1090" y="232" text-anchor="middle" class="s">operaciones</text><text x="1090" y="254" text-anchor="middle" class="s">API</text>
<path d="M485 270V380H220V430" class="arrow"/><path d="M485 380H600V430" class="arrow"/><path d="M1090 280V380H980V430" class="arrow"/>
<rect x="60" y="435" width="320" height="145" rx="18" fill="#fff" class="box"/><text x="220" y="477" text-anchor="middle" class="h">Operaciones de archivos</text><text x="220" y="510" text-anchor="middle" class="t">encrypt(path) · decrypt(path)</text><text x="220" y="542" text-anchor="middle" class="s">contenido + metadata autenticada</text>
<rect x="440" y="435" width="320" height="145" rx="18" fill="#fff" class="box"/><text x="600" y="477" text-anchor="middle" class="h">Operaciones de nombres</text><text x="600" y="510" text-anchor="middle" class="t">archivo · directorio</text><text x="600" y="542" text-anchor="middle" class="s">descendientes sin modificar</text>
<rect x="820" y="435" width="320" height="145" rx="18" fill="url(#teal)" class="box"/><text x="980" y="477" text-anchor="middle" class="h">Filesystem + journal</text><text x="980" y="510" text-anchor="middle" class="t">publicar · retirar · inspeccionar</text><text x="980" y="542" text-anchor="middle" class="s">diagnóstico de solo lectura</text><text x="60" y="620" class="s">Cifrar un directorio cambia solo su nombre. No hay recorrido recursivo ni recuperación automática.</text>
</svg>