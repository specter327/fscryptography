<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">fscryptography architecture</title><desc id="desc">Public Manager API coordinates file and directory operations using independent content and name cryptographic primitives backed by Tink, Argon2id and AES-GCM.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
 <style>
 .h{font:700 22px Inter,Segoe UI,Arial;fill:#0f172a}.s{font:15px Inter,Segoe UI,Arial;fill:#334155}.tiny{font:13px Inter,Segoe UI,Arial;fill:#475569}.box{fill:url(#panel);stroke:#94a3b8;stroke-width:1.5}.crypto{fill:#eef2ff;stroke:#818cf8;stroke-width:1.5}.api{fill:#ecfeff;stroke:#06b6d4;stroke-width:2}
 </style>
</defs>
<rect width="1200" height="590" rx="24" fill="#f1f5f9"/>
<text x="56" y="58" class="h" font-size="27">Public API and operational layers</text>
<rect x="56" y="90" width="1088" height="90" rx="16" class="api"/>
<text x="88" y="128" class="h">fscryptography.Manager</text><text x="88" y="155" class="s">MasterKey lifecycle · context management · change_key() · export_key()</text>
<path d="M600 180V220M260 220H940M260 220V250M600 220V250M940 220V250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="86" y="250" width="348" height="100" rx="14" class="box"/><text x="116" y="289" class="h">File operations</text><text x="116" y="319" class="s">encrypt() · decrypt()</text>
<rect x="426" y="250" width="348" height="100" rx="14" class="box"/><text x="456" y="289" class="h">Directory operations</text><text x="456" y="319" class="s">encrypt() · decrypt() · names only</text>
<rect x="766" y="250" width="348" height="100" rx="14" class="box"/><text x="796" y="289" class="h">Filesystem / format</text><text x="796" y="319" class="s">Paths · headers · temporaries · journal</text>
<path d="M260 350V395H600V425M600 350V425M940 350V395H600" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="86" y="425" width="500" height="110" rx="14" class="crypto"/><text x="116" y="465" class="h">Content keyset</text><text x="116" y="495" class="s">Google Tink · Streaming AEAD · AES256_GCM_HKDF_1MB</text>
<rect x="614" y="425" width="500" height="110" rx="14" class="crypto"/><text x="644" y="465" class="h">Names keyset</text><text x="644" y="495" class="s">Google Tink · AEAD · AES256_GCM</text>
<text x="600" y="570" text-anchor="middle" class="tiny">MasterKey protection (optional): Argon2id + AES-256-GCM · independent of the operational keysets</text>
</svg>