name: Build and validate distributions

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/distribution.yml"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - "src/**"
      - "docs/**"
      - "tests/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/distribution.yml"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - "src/**"
      - "docs/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import fscryptography

          assert fscryptography.__version__ == "0.1.0"
          key = fscryptography.generate()
          with fscryptography.Manager(key=key) as manager:
              assert manager.export_key() == key
              assert callable(manager.file.encrypt)
              assert callable(manager.file.decrypt)
              assert callable(manager.dir.encrypt)
              assert callable(manager.dir.decrypt)
          print("Installed wheel smoke test passed.")
          PY

      - name: Validate maintenance scripts
        run: |
          python -m compileall -q scripts
          python scripts/update/github.py --help

      - name: Run unit and format tests
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install ".[test]"
          python -m pytest -q tests/unit tests/file_format

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
