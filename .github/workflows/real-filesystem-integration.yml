name: Real filesystem integration

on:
  pull_request:
    paths:
      - ".github/workflows/real-filesystem-integration.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/real-filesystem-integration.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-integration:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Record Linux OS, runtime, dependencies, and filesystem
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "=== Operating system ==="
          cat /etc/os-release
          uname -a
          echo "=== Filesystem containing the workspace ==="
          findmnt -T "$GITHUB_WORKSPACE" -o TARGET,SOURCE,FSTYPE,OPTIONS
          echo "=== Python and runtime dependencies ==="
          python - <<'PY'
          import importlib.metadata
          import platform
          import sys

          print("python:", sys.version)
          print("platform:", platform.platform())
          print("architecture:", platform.machine())
          for package in ("fscryptography", "tink", "argon2-cffi", "cryptography", "pytest"):
              try:
                  print(f"{package}:", importlib.metadata.version(package))
              except importlib.metadata.PackageNotFoundError:
                  print(f"{package}: not installed")
          PY

      - name: Record Windows OS, runtime, dependencies, and filesystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "=== Operating system ==="
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          echo "=== Filesystem containing the workspace ==="
          $drive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive.Name
          Get-Volume -DriveLetter $drive | Select-Object DriveLetter, FileSystem, FileSystemLabel, AllocationUnitSize | Format-List
          echo "=== Python and runtime dependencies ==="
          python -c "import importlib.metadata as m, platform, sys; print('python:', sys.version); print('platform:', platform.platform()); print('architecture:', platform.machine()); [print(name + ':', m.version(name)) for name in ('fscryptography', 'tink', 'argon2-cffi', 'cryptography', 'pytest')]"

      - name: Run real-filesystem integration
        run: python -m pytest -q -s tests/real_resources
