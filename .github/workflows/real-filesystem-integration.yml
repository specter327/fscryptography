name: Real filesystem integration

on:
  pull_request:
    paths:
      - ".github/workflows/real-filesystem-integration.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/real-filesystem-integration.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-integration:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run real-filesystem integration
        run: python -m pytest -q -s tests/real_resources
