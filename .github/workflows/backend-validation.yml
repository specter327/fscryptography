name: Backend cryptography validation

on:
  push:
    paths:
      - ".github/workflows/backend-validation.yml"
      - "tests/backend_validation/**"
  pull_request:
    paths:
      - ".github/workflows/backend-validation.yml"
      - "tests/backend_validation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tink-streaming-aead:
    name: Tink Streaming AEAD / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tink
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tink>=1.11,<2"

      - name: Validate AES256_GCM_HKDF_1MB
        run: python tests/backend_validation/test_tink_streaming_aead.py

  master-key-protection:
    name: MasterKey protection / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install protection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "argon2-cffi>=23.1,<26" "cryptography>=42,<47"

      - name: Validate Argon2id and AES-256-GCM
        run: python tests/backend_validation/test_master_key_protection.py
