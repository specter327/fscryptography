name: Backend cryptography validation

on:
  push:
    paths:
      - ".github/workflows/backend-validation.yml"
      - "src/**"
      - "tests/backend_validation/**"
      - "tests/master_key_format/**"
      - "tests/unit/**"
      - "tests/file_format/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/backend-validation.yml"
      - "src/**"
      - "tests/backend_validation/**"
      - "tests/master_key_format/**"
      - "tests/unit/**"
      - "tests/file_format/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-unit-tests:
    name: Package unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run package unit tests
        run: python -m pytest -q tests/unit tests/file_format

  tink-streaming-aead:
    name: Tink Streaming AEAD / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tink
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tink>=1.11,<2"

      - name: Validate AES256_GCM_HKDF_1MB
        run: python tests/backend_validation/test_tink_streaming_aead.py

  tink-filename-aead:
    name: Tink filename AEAD / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tink
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tink>=1.11,<2"

      - name: Validate AES256_GCM for filename AEAD
        run: python tests/backend_validation/test_tink_aead_names.py

  master-key-protection:
    name: MasterKey protection / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install protection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "argon2-cffi>=23.1,<26" "cryptography>=42,<47"

      - name: Validate Argon2id and AES-256-GCM
        run: python tests/backend_validation/test_master_key_protection.py

      - name: Validate MasterKey v1.0 golden vectors
        run: python tests/master_key_format/test_master_key_format_vectors.py
