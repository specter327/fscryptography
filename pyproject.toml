[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fscryptography"
version = "0.1.0"
description = "Filesystem-oriented authenticated encryption for files and names"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = [
    "cryptography",
    "filesystem",
    "file-encryption",
    "authenticated-encryption",
    "tink",
    "argon2id",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "tink>=1.16.1,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=42,<47",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/specter327/fscryptography"
Repository = "https://github.com/specter327/fscryptography"
Documentation = "https://github.com/specter327/fscryptography/tree/main/docs"
Issues = "https://github.com/specter327/fscryptography/issues"
Changelog = "https://github.com/specter327/fscryptography/releases"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
fscryptography = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
